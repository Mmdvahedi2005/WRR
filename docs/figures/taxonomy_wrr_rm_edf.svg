<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440">
<defs>
  <linearGradient id="hdrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#0F172A"/>
    <stop offset="100%" stop-color="#1E3A8A"/>
  </linearGradient>
  <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
  </marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
  </marker>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
  </marker>
</defs>
<rect width="940" height="440" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="0" y="0" width="940" height="64" rx="12" fill="url(#hdrGrad)"/>
<rect x="0" y="50" width="940" height="14" fill="url(#hdrGrad)"/>
<text x="28" y="30" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">Scheduling Paradigm Taxonomy — WRR vs Rate Monotonic (RM) vs EDF</text>
<text x="28" y="50" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#CBD5E1">Comparing Proportional-Share Time-Slicing against Static & Dynamic Real-Time Priority Schedulers</text>
<g filter="url(#cardShadow)">
  <rect x="35" y="95" width="270" height="295" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
</g>
<text x="170.0" y="117" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1E3A8A">Weighted Round Robin (WRR)</text>
<text x="170.0" y="135" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Rule: Cyclic turns × w_i quanta</text>
<text x="170.0" y="150" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Priority: Weight-proportional share</text>
<text x="170.0" y="165" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Needs Periods / Deadlines? NO</text>
<text x="170.0" y="180" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Dispatch Complexity: O(1)</text>
<text x="170.0" y="195" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Starvation: FREE (guaranteed share)</text>
<text x="170.0" y="210" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Overload: Graceful proportional</text>
<text x="170.0" y="225" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">  degradation across all tasks</text>
<text x="170.0" y="240" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Weakness: Deadline-agnostic;</text>
<text x="170.0" y="255" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">  misses tight deadlines at high U</text>
<g filter="url(#cardShadow)">
  <rect x="335" y="95" width="270" height="295" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
</g>
<text x="470.0" y="117" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0F766E">Rate Monotonic (RM)</text>
<text x="470.0" y="135" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Rule: Shorter period T_i -> higher prio</text>
<text x="470.0" y="150" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Priority: Static (Fixed at design)</text>
<text x="470.0" y="165" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Needs Periods? YES (D_i = T_i)</text>
<text x="470.0" y="180" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Dispatch Complexity: O(1) bitmap</text>
<text x="470.0" y="195" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• LL Bound: n(2^(1/n) - 1) -> 69.3%</text>
<text x="470.0" y="210" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Exact Test: RTA fixed-point</text>
<text x="470.0" y="225" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Overload: Predictable — protects</text>
<text x="470.0" y="240" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">  high-rate tasks; starves lowest T_n</text>
<text x="470.0" y="255" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Weakness: Sub-optimal for U > 0.78</text>
<g filter="url(#cardShadow)">
  <rect x="635" y="95" width="270" height="295" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
</g>
<text x="770.0" y="117" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#B45309">Earliest Deadline First (EDF)</text>
<text x="770.0" y="135" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Rule: Earliest abs deadline d_{i,k}</text>
<text x="770.0" y="150" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Priority: Dynamic (job-level)</text>
<text x="770.0" y="165" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Needs Deadlines? YES</text>
<text x="770.0" y="180" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Dispatch Complexity: O(log n) heap</text>
<text x="770.0" y="195" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Bound (D_i=T_i): sum(C_i/T_i) <= 100%</text>
<text x="770.0" y="210" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Optimality: Dertouzos (1974) optimal</text>
<text x="770.0" y="225" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">  on single preemptive processor</text>
<text x="770.0" y="240" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Starvation: Possible in overload</text>
<text x="770.0" y="255" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Weakness: Domino Effect when U > 1</text>
</svg>
