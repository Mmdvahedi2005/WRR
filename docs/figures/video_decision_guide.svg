<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380">
<defs>
  <linearGradient id="hdrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#0F172A"/>
    <stop offset="100%" stop-color="#1E3A8A"/>
  </linearGradient>
  <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
  </marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
  </marker>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
  </marker>
</defs>
<rect width="920" height="380" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="0" y="0" width="920" height="64" rx="12" fill="url(#hdrGrad)"/>
<rect x="0" y="50" width="920" height="14" fill="url(#hdrGrad)"/>
<text x="28" y="30" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">Multi-Dimensional Comparison Summary Featured in Video Scene 6</text>
<text x="28" y="50" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#CBD5E1">Decision Guide Across Fairness, Hard Deadlines, Overload Resilience, and Runtime Complexity</text>
<g filter="url(#cardShadow)">
  <rect x="35" y="95" width="270" height="245" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
</g>
<text x="170.0" y="117" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0F172A">Choose WRR When:</text>
<text x="170.0" y="135" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Tasks have QoS weights, not deadlines</text>
<text x="170.0" y="150" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Starvation freedom under overload</text>
<text x="170.0" y="165" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">  is mandatory (cloud / network)</text>
<text x="170.0" y="180" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• O(1) low-overhead cyclic dispatch</text>
<text x="170.0" y="195" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Interleaved WRR if low jitter needed</text>
<g filter="url(#cardShadow)">
  <rect x="325" y="95" width="270" height="245" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
</g>
<text x="460.0" y="117" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0F172A">Choose RM When:</text>
<text x="460.0" y="135" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Hard periodic tasks (D_i = T_i)</text>
<text x="460.0" y="150" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Static certification required</text>
<text x="460.0" y="165" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">  (avionics / automotive RTOS)</text>
<text x="460.0" y="180" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• High-rate tasks must survive</text>
<text x="460.0" y="195" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">  overload even if lowest starves</text>
<g filter="url(#cardShadow)">
  <rect x="615" y="95" width="270" height="245" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
</g>
<text x="750.0" y="117" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0F172A">Choose EDF When:</text>
<text x="750.0" y="135" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• CPU utilization is high (0.78..1.00)</text>
<text x="750.0" y="150" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Optimal single-CPU schedulability</text>
<text x="750.0" y="165" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">  is required (0 misses up to U=1)</text>
<text x="750.0" y="180" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">• Admission control prevents U > 1</text>
<text x="750.0" y="195" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">  Domino overload cascades</text>
</svg>
