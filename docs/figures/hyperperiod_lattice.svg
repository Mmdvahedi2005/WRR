<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380">
<defs>
  <linearGradient id="hdrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#0F172A"/>
    <stop offset="100%" stop-color="#1E3A8A"/>
  </linearGradient>
  <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
  </marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
  </marker>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
  </marker>
</defs>
<rect width="940" height="380" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="0" y="0" width="940" height="64" rx="12" fill="url(#hdrGrad)"/>
<rect x="0" y="50" width="940" height="14" fill="url(#hdrGrad)"/>
<text x="28" y="30" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">Three-Process Periodic Release & Deadline Lattice over Hyperperiod H = 24</text>
<text x="28" y="50" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#CBD5E1">Case B Task Set: P1(C=1, T=4, D=4), P2(C=3, T=8, D=8), P3(C=4, T=12, D=12) — U = 23/24 ≈ 95.83%</text>
<g filter="url(#cardShadow)">
  <rect x="35" y="88" width="265" height="80" rx="8" fill="#EFF6FF" stroke="#1E3A8A" stroke-width="1.6"/>
</g>
<text x="167.5" y="110" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0F172A">P1: C=1, T=4, D=4 (U=0.25)</text>
<text x="167.5" y="128" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">6 jobs in [0,24): r = 0, 4, 8, 12, 16, 20</text>
<text x="167.5" y="143" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">RM Priority: HIGHEST (shortest period)</text>
<g filter="url(#cardShadow)">
  <rect x="335" y="88" width="265" height="80" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
</g>
<text x="467.5" y="110" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0F172A">P2: C=3, T=8, D=8 (U=0.375)</text>
<text x="467.5" y="128" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">3 jobs in [0,24): r = 0, 8, 16</text>
<text x="467.5" y="143" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">RM Priority: MEDIUM (T2 = 8)</text>
<g filter="url(#cardShadow)">
  <rect x="635" y="88" width="265" height="80" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
</g>
<text x="767.5" y="110" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0F172A">P3: C=4, T=12, D=12 (U=0.333)</text>
<text x="767.5" y="128" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">2 jobs in [0,24): r = 0, 12</text>
<text x="767.5" y="143" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">RM Priority: LOWEST (misses @ t=12!)</text>
<g filter="url(#cardShadow)">
  <rect x="60" y="205" width="380" height="135" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/>
</g>
<text x="250.0" y="227" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0F172A">Exact RM Response-Time Analysis (RTA)</text>
<text x="250.0" y="245" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">R1* = 1 <= 4 (OK)  |  R2* = 3 + ceil(3/4)*1 = 4 <= 8 (OK)</text>
<text x="250.0" y="260" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">R3^(0)=4 -> R3^(1)=8 -> R3^(2)=9 -> R3^(3)=13 > D3=12</text>
<text x="250.0" y="275" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">Verdict: P3,1 misses deadline at t = 12 (1 unit left)!</text>
<g filter="url(#cardShadow)">
  <rect x="495" y="205" width="385" height="135" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="1.6"/>
</g>
<text x="687.5" y="227" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0F172A">EDF Exact Utilization Bound (D_i = T_i)</text>
<text x="687.5" y="245" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">U_total = 1/4 + 3/8 + 4/12 = 6/24 + 9/24 + 8/24 = 23/24</text>
<text x="687.5" y="260" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">Since 23/24 = 0.9583 <= 1.0000, EDF is 100% FEASIBLE!</text>
<text x="687.5" y="275" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">At t=8: d(P3,1)=12 < d(P2,2)=16 -> EDF runs P3,1 first!</text>
</svg>
