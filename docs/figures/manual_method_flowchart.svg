<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
<defs>
  <linearGradient id="hdrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#0F172A"/>
    <stop offset="100%" stop-color="#1E3A8A"/>
  </linearGradient>
  <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
  </marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
  </marker>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
  </marker>
</defs>
<rect width="900" height="360" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="0" y="0" width="900" height="64" rx="12" fill="url(#hdrGrad)"/>
<rect x="0" y="50" width="900" height="14" fill="url(#hdrGrad)"/>
<text x="28" y="30" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">Systematic Hand-Calculation Procedure for RM & EDF on Paper</text>
<text x="28" y="50" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#CBD5E1">Five-step method used in the manual worksheet tables</text>
<g filter="url(#cardShadow)">
  <rect x="30" y="120" width="145" height="150" rx="8" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="1.6"/>
</g>
<text x="102.5" y="142" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0F172A">Step 1: Parameters</text>
<text x="102.5" y="160" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">Compute U = Σ(C_i/T_i)</text>
<text x="102.5" y="175" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">H = lcm(T1, T2, T3)</text>
<line x1="175" y1="195" x2="203" y2="195" stroke="#1E3A8A" stroke-width="1.7" marker-end="url(#arrowBlue)"/>
<g filter="url(#cardShadow)">
  <rect x="205" y="120" width="145" height="150" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.6"/>
</g>
<text x="277.5" y="142" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0F172A">Step 2: Feasibility</text>
<text x="277.5" y="160" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">Check LL bound 0.7798</text>
<text x="277.5" y="175" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">& RTA fixed-point R_i</text>
<line x1="350" y1="195" x2="378" y2="195" stroke="#1E3A8A" stroke-width="1.7" marker-end="url(#arrowBlue)"/>
<g filter="url(#cardShadow)">
  <rect x="380" y="120" width="145" height="150" rx="8" fill="#F8FAFC" stroke="#0D9488" stroke-width="1.6"/>
</g>
<text x="452.5" y="142" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0F172A">Step 3: Job Table</text>
<text x="452.5" y="160" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">List all (r_{i,k}, d_{i,k})</text>
<text x="452.5" y="175" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">inside [0, H)</text>
<line x1="525" y1="195" x2="553" y2="195" stroke="#1E3A8A" stroke-width="1.7" marker-end="url(#arrowBlue)"/>
<g filter="url(#cardShadow)">
  <rect x="555" y="120" width="145" height="150" rx="8" fill="#F8FAFC" stroke="#D97706" stroke-width="1.6"/>
</g>
<text x="627.5" y="142" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0F172A">Step 4: Tick Table</text>
<text x="627.5" y="160" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">RM: min T_i</text>
<text x="627.5" y="175" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">EDF: min abs d_{i,k}</text>
<line x1="700" y1="195" x2="728" y2="195" stroke="#1E3A8A" stroke-width="1.7" marker-end="url(#arrowBlue)"/>
<g filter="url(#cardShadow)">
  <rect x="730" y="120" width="145" height="150" rx="8" fill="#F8FAFC" stroke="#DC2626" stroke-width="1.6"/>
</g>
<text x="802.5" y="142" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0F172A">Step 5: Audit</text>
<text x="802.5" y="160" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">Verify Σrun = H - idle</text>
<text x="802.5" y="175" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">& check f_{i,k} <= d_{i,k}</text>
</svg>
