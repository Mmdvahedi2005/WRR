<svg xmlns="http://www.w3.org/2000/svg" width="900" height="980" viewBox="0 0 900 980">
<rect width="900" height="980" fill="#f7f8fa"/>
<text x="450" y="38" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="#202938">Exercise 5 — WRR Flowchart</text>
<text x="450" y="62" text-anchor="middle" font-family="Arial" font-size="14" fill="#526071">Step-by-step dispatch in schedule() — quantum = 1, workload P1(3,5) P2(2,4) P3(1,3)</text>
<g font-family="Arial" text-anchor="middle">
<rect x="300" y="85" width="300" height="50" rx="25" fill="#4e79a7"/>
<text x="450" y="116" font-size="16" font-weight="bold" fill="white">Start</text>
<rect x="250" y="160" width="400" height="60" rx="10" fill="white" stroke="#4e79a7" stroke-width="2"/>
<text x="450" y="184" font-size="14" fill="#263445">Validate quantum &gt; 0, unique names</text>
<text x="450" y="204" font-size="14" fill="#263445">Create tasks with weights and bursts</text>
<polygon points="450,245 570,295 450,345 330,295" fill="#fff2e5" stroke="#f28e2b" stroke-width="2"/>
<text x="450" y="290" font-size="14" font-weight="bold" fill="#8c4c0c">Any task</text>
<text x="450" y="308" font-size="14" font-weight="bold" fill="#8c4c0c">unfinished?</text>
<rect x="250" y="370" width="400" height="60" rx="10" fill="white" stroke="#4e79a7" stroke-width="2"/>
<text x="450" y="394" font-size="14" fill="#263445">Visit tasks in input order</text>
<text x="450" y="414" font-size="14" fill="#263445">For each task: up to weight quanta</text>
<rect x="250" y="455" width="400" height="60" rx="10" fill="#eaf5ec" stroke="#59a14f" stroke-width="2"/>
<text x="450" y="479" font-size="14" fill="#263445">Acquire DispatchGuard</text>
<text x="450" y="499" font-size="14" fill="#263445">(semaphore / monitor / both)</text>
<rect x="250" y="540" width="400" height="70" rx="10" fill="white" stroke="#4e79a7" stroke-width="2"/>
<text x="450" y="564" font-size="14" fill="#263445">Run min(quantum, remaining)</text>
<text x="450" y="584" font-size="14" fill="#263445">Advance clock; record Gantt segment</text>
<text x="450" y="602" font-size="14" fill="#263445">If remaining == 0: set completion</text>
<rect x="250" y="635" width="400" height="50" rx="10" fill="#eaf5ec" stroke="#59a14f" stroke-width="2"/>
<text x="450" y="665" font-size="14" fill="#263445">Release guard; next quantum / task</text>
<rect x="250" y="710" width="400" height="60" rx="10" fill="white" stroke="#4e79a7" stroke-width="2"/>
<text x="450" y="734" font-size="14" fill="#263445">Compute metrics: turnaround, waiting</text>
<text x="450" y="754" font-size="14" fill="#263445">makespan = final clock</text>
<rect x="300" y="795" width="300" height="50" rx="25" fill="#4e79a7"/>
<text x="450" y="826" font-size="16" font-weight="bold" fill="white">End — report + Gantt</text>
</g>
<g stroke="#526071" stroke-width="2" fill="none">
<path d="M450 135 V160"/>
<path d="M450 220 V245"/>
<path d="M450 345 V370"/>
<path d="M450 430 V455"/>
<path d="M450 515 V540"/>
<path d="M450 610 V635"/>
<path d="M450 685 V710"/>
<path d="M450 770 V795"/>
</g>
<path d="M570 295 H700 V400 H650" stroke="#f28e2b" stroke-width="2" fill="none"/>
<text x="710" y="290" font-family="Arial" font-size="13" fill="#8c4c0c">No →</text>
<text x="710" y="308" font-family="Arial" font-size="13" fill="#8c4c0c">report</text>
<text x="455" y="340" font-family="Arial" font-size="13" fill="#8c4c0c">Yes</text>
<text x="450" y="890" text-anchor="middle" font-family="Arial" font-size="13" fill="#526071">Figure 4 — Flowchart. The loop repeats until all bursts are consumed (makespan 12).</text>
<text x="450" y="912" text-anchor="middle" font-family="Arial" font-size="13" fill="#526071">Guard protects each dispatch update; order is identical for all three sync modes.</text>
</svg>
