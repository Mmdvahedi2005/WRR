<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
<defs>
  <linearGradient id="hdrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#0F172A"/>
    <stop offset="100%" stop-color="#1E3A8A"/>
  </linearGradient>
  <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
  </marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
  </marker>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
  </marker>
</defs>
<rect width="920" height="420" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="0" y="0" width="920" height="64" rx="12" fill="url(#hdrGrad)"/>
<rect x="0" y="50" width="920" height="14" fill="url(#hdrGrad)"/>
<text x="28" y="30" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">Weighted Round Robin (WRR) — System & Simulator Architecture</text>
<text x="28" y="50" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#CBD5E1">Dual-Mode Engine: OS Process Controller (WRR.py) + Deterministic Discrete-Event Simulator (src/wrr_scheduler.py)</text>
<g filter="url(#cardShadow)">
  <rect x="30" y="95" width="220" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
</g>
<text x="140.0" y="117" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0F172A">1. Workload & Spec Input</text>
<text x="140.0" y="135" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">Task Specs: (name, w_i > 0, burst_i, arr_i)</text>
<text x="140.0" y="150" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">Quantum q > 0 & Context Switch cs</text>
<text x="140.0" y="165" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">Validation & Unique ID Guard</text>
<g filter="url(#cardShadow)">
  <rect x="310" y="95" width="290" height="110" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
</g>
<text x="455.0" y="117" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0F172A">2. Weighted Ready Ring</text>
<text x="455.0" y="135" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">Circular Ready Queue ordered by arrival/ID</text>
<text x="455.0" y="150" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">Classic WRR: up to w_i consecutive quanta</text>
<text x="455.0" y="165" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">Interleaved WRR: sub-rounds s = 1..max(w)</text>
<g filter="url(#cardShadow)">
  <rect x="660" y="95" width="230" height="110" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
</g>
<text x="775.0" y="117" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0F172A">3. Dispatch & Clock Core</text>
<text x="775.0" y="135" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">run = min(q, remaining_i)</text>
<text x="775.0" y="150" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">Update clock, CS overhead, completion</text>
<text x="775.0" y="165" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">Record exact Gantt & slice events</text>
<g filter="url(#cardShadow)">
  <rect x="160" y="265" width="280" height="115" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
</g>
<text x="300.0" y="287" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0F172A">4A. OS Process Mode (WRR.py)</text>
<text x="300.0" y="305" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">subprocess.Popen + psutil.Process</text>
<text x="300.0" y="320" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">SIGSTOP / suspend() & resume()</text>
<text x="300.0" y="335" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">Measures kernel user+sys CPU time</text>
<g filter="url(#cardShadow)">
  <rect x="490" y="265" width="310" height="115" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
</g>
<text x="645.0" y="287" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0F172A">4B. Metrics & Analytics Output</text>
<text x="645.0" y="305" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">Turnaround, Waiting, Response Latency</text>
<text x="645.0" y="320" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">Jain's Fairness Index J & Share Ratio</text>
<text x="645.0" y="335" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#334155">Theoretical Starvation Bound W_max(i)</text>
<line x1="250" y1="150" x2="308" y2="150" stroke="#2563EB" stroke-width="1.7" marker-end="url(#arrowBlue)"/>
<text x="279.0" y="144.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2563EB">Validated Tasks</text>
<line x1="600" y1="150" x2="658" y2="150" stroke="#0D9488" stroke-width="1.7" marker-end="url(#arrowBlue)"/>
<text x="629.0" y="144.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0D9488">Selected Task</text>
<line x1="455" y1="205" x2="300" y2="263" stroke="#475569" stroke-width="1.7" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="377.5" y="228.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569">OS Runtime</text>
<line x1="775" y1="205" x2="645" y2="263" stroke="#7C3AED" stroke-width="1.7" marker-end="url(#arrowBlue)"/>
<text x="710.0" y="228.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#7C3AED">Event Trace</text>
</svg>
