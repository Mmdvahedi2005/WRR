<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" fill="#f7f8fa"/>
<text x="600" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="#202938">Exercise 5 — WRR Architecture</text>
<text x="600" y="66" text-anchor="middle" font-family="Arial" font-size="15" fill="#526071">Components of exercise5_wrr.py and how they connect</text>
<g font-family="Arial" text-anchor="middle">
<rect x="40" y="100" width="200" height="90" rx="12" fill="#eaf2fb" stroke="#4e79a7" stroke-width="2"/>
<text x="140" y="130" font-size="17" font-weight="bold" fill="#24476b">CLI (main)</text>
<text x="140" y="152" font-size="13" fill="#263445">argparse: --mode, --quantum</text>
<text x="140" y="170" font-size="13" fill="#263445">--gantt output prefix</text>
<rect x="40" y="230" width="200" height="90" rx="12" fill="#eaf2fb" stroke="#4e79a7" stroke-width="2"/>
<text x="140" y="260" font-size="17" font-weight="bold" fill="#24476b">Task dataclass</text>
<text x="140" y="282" font-size="13" fill="#263445">name, weight, burst</text>
<text x="140" y="300" font-size="13" fill="#263445">remaining, completion</text>
<rect x="340" y="165" width="240" height="130" rx="12" fill="#fff2e5" stroke="#f28e2b" stroke-width="2"/>
<text x="460" y="195" font-size="18" font-weight="bold" fill="#8c4c0c">schedule()</text>
<text x="460" y="218" font-size="13" fill="#263445">Deterministic dispatcher loop</text>
<text x="460" y="238" font-size="13" fill="#263445">Returns events, gantt, metrics</text>
<text x="460" y="258" font-size="13" fill="#263445">and makespan</text>
<rect x="680" y="100" width="240" height="90" rx="12" fill="#eaf5ec" stroke="#59a14f" stroke-width="2"/>
<text x="800" y="130" font-size="17" font-weight="bold" fill="#28613a">DispatchGuard</text>
<text x="800" y="152" font-size="13" fill="#263445">semaphore | monitor | both</text>
<text x="800" y="170" font-size="13" fill="#263445">Fixed lock order in "both"</text>
<rect x="680" y="230" width="240" height="90" rx="12" fill="#eaf5ec" stroke="#59a14f" stroke-width="2"/>
<text x="800" y="260" font-size="17" font-weight="bold" fill="#28613a">gantt_svg()</text>
<text x="800" y="282" font-size="13" fill="#263445">Writes SVG Gantt chart</text>
<text x="800" y="300" font-size="13" fill="#263445">per mode to outputs/</text>
<rect x="980" y="165" width="180" height="130" rx="12" fill="#f3e8f5" stroke="#b07aa1" stroke-width="2"/>
<text x="1070" y="195" font-size="17" font-weight="bold" fill="#5b3a6b">Tests</text>
<text x="1070" y="218" font-size="13" fill="#263445">test_exercise5_wrr.py</text>
<text x="1070" y="238" font-size="13" fill="#263445">9 unit tests</text>
<text x="1070" y="258" font-size="13" fill="#263445">python -m unittest -v</text>
<rect x="340" y="380" width="580" height="70" rx="12" fill="white" stroke="#526071" stroke-width="2"/>
<text x="630" y="408" font-size="16" font-weight="bold" fill="#202938">Outputs</text>
<text x="630" y="430" font-size="13" fill="#263445">Printed metrics + wrr-gantt-{semaphore,monitor,both}.svg</text>
</g>
<g stroke="#526071" stroke-width="2" fill="none">
<path d="M240 145 H340"/>
<path d="M240 275 H340"/>
<path d="M580 195 H680"/>
<path d="M580 275 H680"/>
<path d="M920 230 H980"/>
<path d="M460 295 V380"/>
<path d="M800 320 V380"/>
</g>
<g fill="#526071" font-family="Arial" font-size="12">
<text x="280" y="138">creates</text>
<text x="280" y="268">schedules</text>
<text x="610" y="188">guards</text>
<text x="610" y="268">renders</text>
<text x="925" y="223">verifies</text>
</g>
<text x="600" y="500" text-anchor="middle" font-family="Arial" font-size="15" fill="#364152">Single dispatcher + guard per dispatch: deterministic and comparable across sync modes.</text>
<text x="600" y="525" text-anchor="middle" font-family="Arial" font-size="13" fill="#526071">Figure 3 — Architecture. Arrows show data/control flow, not thread parallelism.</text>
</svg>
